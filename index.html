<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Lista de Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <p>Proyecto - Vivian Rivera</p> 
    <!-- Bootswatch Cosmo Theme -->
    <link
      rel="stylesheet" href="https://bootswatch.com/5/vapor/bootstrap.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="App.css" />
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark" style="background-color: rgb(19, 0, 27);">
        <a href="/" class="navbar-brand"> 
             Lista de Productos
        </a>
        <img src="https://atlasforge.gg/images/gamepreviews/cyberpunk-2077.webp" width="400" height="80" class="d-inline-block align-top">
    </nav>

    <div class="container">
        <!-- APPLICATION -->
        <div id="App" class="row pt-5">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header" style="background-color: rgb(19, 0, 27);">
                        <h1>Agregar un Producto</h1>
                            <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
                            <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
                            <link href="style.css" rel="stylesheet">
                    </div>
                    <form id="product-form" class="card-body" style="background-color: rgb(19, 0, 27);">
                        <div class="form-group">
                            <input type="text" id="name" placeholder="Nombre del Producto" class="form-control">
                        </div>
                        <div class="form-group">
                            <input type="number" id="price" step="0.01" placeholder="Precio del Producto" class="form-control">
                        </div>
                        <div class="form-group">
                            <input type="number" id="year" min="1900" max="2099" step="1" value="2026" class="form-control">
                        </div>
                            <input type="submit" value="Guardar" class="btn btn-primary btn-block">
                    </form>
                </div>
                
            </div>
            

            <!-- PRODUCTS LIST -->
            <div id="product-list" class="col-md-7">
        </div>
    </div>
        <script src="App.js" type="module"></script>
</body>
</html>
